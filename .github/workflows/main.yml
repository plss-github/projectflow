name: Release GLPI Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_NAME: projectflow

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Definir versão da release
        id: vars
        run: |
          VERSION=$(grep -oP "define\('PLUGIN_PROJECTFLOW_VERSION',\s*'\K[^']+" setup.php)
          if [ -z "$VERSION" ]; then
            echo "Versão não encontrada em setup.php" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Só publica quando a versão do setup.php ainda não tem tag.
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $VERSION já existe; nenhuma release será criada."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validar sintaxe
        if: steps.vars.outputs.exists == 'false'
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          node --check "public/js/projectflow-${{ steps.vars.outputs.version }}.js"

      - name: Montar pacote com pasta raiz projectflow/
        if: steps.vars.outputs.exists == 'false'
        run: |
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/${{ env.PLUGIN_NAME }}"
          rsync -a \
            --exclude=.git \
            --exclude=.github \
            --exclude=.gitattributes \
            --exclude='*.tar.gz' \
            ./ "$STAGE/${{ env.PLUGIN_NAME }}/"
          tar -czf "./${{ env.PLUGIN_NAME }}-${{ steps.vars.outputs.version }}.tar.gz" \
            -C "$STAGE" "${{ env.PLUGIN_NAME }}"
          tar -tzf "./${{ env.PLUGIN_NAME }}-${{ steps.vars.outputs.version }}.tar.gz" | head -5

      - name: Criar Release no GitHub
        if: steps.vars.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          name: "Project Flow ${{ steps.vars.outputs.version }}"
          files: |
            ${{ env.PLUGIN_NAME }}-${{ steps.vars.outputs.version }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
